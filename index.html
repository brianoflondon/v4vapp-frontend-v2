<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />
    <meta name="apple-mobile-web-app-title" content="V4V.app" />

    <!-- CSP meta (backup for nginx headers; report-only for safe tuning).
         Note: blob: + https://*.hive.blog are needed in BOTH img-src and connect-src
         because images are axios-fetched to blob URLs, then used as <img>/QR logos.
         See nginx/nginx.conf for the primary definition. -->
    <meta http-equiv="Content-Security-Policy-Report-Only" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' data: blob: https://*.hive.blog https:; connect-src 'self' blob: https://*.hive.blog https://api.v4v.app https://devapi.v4v.app https://rpc.hive.blog https://api.hive.blog https://api.deathwing.me https://api.openhive.network https://rpc.mahdiyari.info https://techcoderx.com https://hiveapi.actifit.io https://api.c0ff33a.uk https://api.coingecko.com wss:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" />

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="favicon.ico" />
  </head>

  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
