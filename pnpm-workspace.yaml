# pnpm 11+ reads settings from this file (not package.json "pnpm" / most .npmrc keys).
# https://pnpm.io/settings
allowBuilds:
  '@parcel/watcher': false
  core-js: false
  chokidar: true
  sass: true
  sass-embedded: true
  esbuild: true
  lightningcss: true
  rolldown: true
  unrs-resolver: true
  secp256k1: false
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
strictDepBuilds: true
trustPolicy: no-downgrade
# Known false positives: older majors republished without trusted-publisher
# evidence after newer majors already had stronger trust (publish-date based).
trustPolicyExclude:
  - '@noble/secp256k1@1.7.2'
  - 'semver@6.3.1'
# Keep the JS sass implementation in place of sass-embedded (macOS 13 native binary crashes).
# Security overrides force patched versions where an upstream package still pins a vulnerable copy.
overrides:
  sass-embedded: npm:sass@1.106.0
  axios: ^1.20.0
  "fast-uri@<4.2.3": 4.2.3
  follow-redirects: ^1.16.1
  form-data@4: 4.0.6
  valibot: 1.5.0
  "hive-auth-wrapper>uuid": ^14.0.3
  "nanoid@>=3.0.0 <3.3.20": 3.3.20
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "brace-expansion@>=1.0.0 <2": 1.1.21
  "brace-expansion@>=5.0.0 <6": 5.0.12
  "immutable@>=5.0.0 <5.1.8": 5.1.9
  "source-map-js@<1.2.2": 1.2.2
  "pbkdf2@<3.1.7": 3.1.7
  "postcss-selector-parser@<7.1.7": 7.1.7
  "serialize-javascript@<7.1.2": 7.1.2
  "hono@<4.13.11": 4.13.13
# Kept for hive / older packages that still expect a flattened node_modules.
shamefullyHoist: true
strictPeerDependencies: false
