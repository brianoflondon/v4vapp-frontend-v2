server {
    listen 80;

    # One image serves production and dev. Traefik picks the host.
    server_name v4v.app dev.v4v.app;

    root /app/dist/pwa;
    index index.html;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security headers, including the report-only CSP. Locations below that
    # set Cache-Control must include the snippet again: an add_header in a
    # location replaces every add_header inherited from the server.
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;

    # Disable cache for static files to avoid stale content
    location ~* \.(js|css)$ {
        expires -1;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0";
    }

    # Use a one hour cache for static files
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1h;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, immutable";
    }
}
