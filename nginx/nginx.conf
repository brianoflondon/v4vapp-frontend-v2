# dev.v4v.app and dev.lnd.v4v.app get an enforced CSP. Every other host
# that this image serves, including v4v.app, stays report-only.
# An empty value makes nginx omit that header.
map $host $csp_enforce {
    default "";
    dev.v4v.app $csp_policy;
    dev.lnd.v4v.app $csp_policy;
}
map $host $csp_report {
    default $csp_policy;
    dev.v4v.app "";
    dev.lnd.v4v.app "";
}

server {
    listen 80;

    # One image serves production and dev. Traefik picks the host.
    server_name v4v.app dev.v4v.app dev.lnd.v4v.app;

    root /app/dist/pwa;
    index index.html;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security headers. Locations below that set Cache-Control must include
    # the snippet again: an add_header in a location replaces every
    # add_header inherited from the server.
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;

    # Disable cache for static files to avoid stale content
    location ~* \.(js|css)$ {
        expires -1;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0";
    }

    # Use a one hour cache for static files
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1h;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, immutable";
    }
}
