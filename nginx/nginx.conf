server {
    listen 80;

    server_name v4v.app;

    root /app/dist/pwa;
    index index.html;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;

    # Disable cache for static files to avoid stale content
    location ~* \.(js|css)$ {
        expires -1;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0";
    }


    # Use a one hour cache for static files
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    # Security headers (directly mitigates XSS risk that makes localStorage JWTs dangerous)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP — report-only mode for safe tuning.
    # Must be kept in sync with actual external calls + blob: usage (audio players, createObjectURL for downloads/media, Hive nodes, CoinGecko, etc.).
    # See also the matching meta tag in index.html. After validation, change to Content-Security-Policy (enforce).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' data: https://*.hive.blog https:; connect-src 'self' blob: https://api.v4v.app https://devapi.v4v.app https://rpc.hive.blog https://api.hive.blog https://api.deathwing.me https://api.openhive.network https://rpc.mahdiyari.info https://techcoderx.com https://hiveapi.actifit.io https://api.c0ff33a.uk https://api.coingecko.com wss:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

}
